[project]
name = "event-pricing-pipeline"
version = "0.1.0"
description = "Daily demand forecast and price recommendations for on-sale events (take-home exercise)."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]

[dependency-groups]
dev = ["pytest>=7.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
